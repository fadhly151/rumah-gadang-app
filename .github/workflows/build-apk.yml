name: Build APK

# Jalan otomatis tiap push ke branch main, atau bisa dipicu manual
# lewat tab "Actions" di GitHub (tombol "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java (dibutuhkan Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold folder android/ jika belum lengkap
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            echo "android/app/build.gradle belum ada, generate project Android dengan flutter create..."
            # Simpan dulu google-services.json kalau sudah ada, supaya tidak tertimpa
            if [ -f "android/app/google-services.json" ]; then
              mkdir -p /tmp/backup
              cp android/app/google-services.json /tmp/backup/google-services.json
            fi
            flutter create --platforms=android --project-name rumah_gadang_app .
            if [ -f "/tmp/backup/google-services.json" ]; then
              cp /tmp/backup/google-services.json android/app/google-services.json
            fi
          else
            echo "Project Android sudah lengkap, lanjut."
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icon
        run: dart run flutter_launcher_icons
        continue-on-error: true # tidak menggagalkan build kalau ikon belum siap

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumah-gadang-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
